function monthTaskCount(m){const t=state.tasks.filter(x=>x.month===m);return {total:t.length,complete:done(t)};}
function timeline(){return `<div class="timeline">${MONTH_GOALS.map(g=>{const n=monthTaskCount(g.m);const active=g.m==='11/2026';return `<button class="timeline-card ${active?'active':''}" data-page="plan" data-month="${attr(g.m)}" style="text-align:left;cursor:pointer"><div class="month">${esc(g.m)}</div><div class="roadtitle">${esc(g.title)}</div><div class="desc">${esc(g.desc)}</div><div class="foot">${n.complete}/${n.total} đầu việc<div class="pbar"><span style="width:${pct(n.complete,n.total)}%"></span></div></div></button>`}).join('')}</div>`;}
function actionRow(tasks,limit){const items=tasks.slice(0,limit);return items.length?items.map((x,i)=>`<div class="task-row"><div class="step">${i+1}</div><div class="desc"><button class="taskname" data-action="edit-task" data-id="${attr(x.id)}">${esc(x.title)}</button><div class="minor">${esc(x.month)} · ${esc(x.week)} · ${esc(x.area)}</div></div>${badge(x.status)}</div>`).join(''):empty('Chưa có đầu việc phù hợp.');}
function dashboard(){const total=state.tasks.length,finished=done(state.tasks), schoolVerified=state.schools.filter(s=>s.verifiedAt&&s.source).length, upcoming=state.tasks.filter(x=>x.month==='11/2026'&&x.status!=='Hoàn tất');const needs=state.schools.filter(x=>!x.entry||!x.tuition||!x.scholarship||!x.deadline).length;const recentExp=state.expenses.filter(x=>x.month==='11/2026');let cost=recentExp.reduce((n,x)=>n+Number(x.amount||0),0);return `
${head('THE APPLICATION COMMAND CENTER','Nam · Taiwan 2027','Tổng hợp tiến độ từ chốt ngành và TOEIC đến nộp hồ sơ tháng 3/2027. Mọi mốc trong Site chỉ là kế hoạch cho tới khi có lịch tuyển sinh chính thức.')}
${banner('<strong>Mốc nộp mục tiêu: tháng 03/2027, không phải deadline đã xác minh.</strong> Không suy ra hạn theo ngày; mỗi trường và học bổng cần kiểm tra riêng nguồn chính thức, ngày/giờ và múi giờ.')}
<div class="grid grid-4">
<div class="card metric"><div class="label">Đầu việc hoàn tất</div><div class="big"><span class="accent">${finished}</span><span class="muted" style="font-size:18px"> / ${total}</span></div><div class="small">${pct(finished,total)}% tiến độ checklist</div><div class="symbol">✓</div><div class="track" style="margin-top:15px"><span style="width:${pct(finished,total)}%"></span></div></div>
<div class="card metric"><div class="label">Việc tháng 11 còn mở</div><div class="big">${upcoming.length}</div><div class="small">Theo kế hoạch NAM HUB</div><div class="symbol">▤</div></div>
<div class="card metric"><div class="label">Trường đã đủ nguồn xác minh</div><div class="big">${schoolVerified}<span class="muted" style="font-size:18px"> / ${state.schools.length}</span></div><div class="small">Có URL nguồn và ngày kiểm tra</div><div class="symbol">⌕</div></div>
<div class="card metric"><div class="label">Chi chuẩn bị tháng 11</div><div class="big" style="font-size:26px">${recentExp.length?fmt(cost)+' ₫':'—'}</div><div class="small">Mục tiêu: 2–4 triệu ₫/tháng${!recentExp.length?' · chưa ghi chi phí':''}</div><div class="symbol">₫</div></div></div>
${section('Ưu tiên 7 ngày','Chốt thứ tự công việc và hai block Calendar đã kiểm tra.','<button class="btn btn-sm" data-page="priority">Mở kế hoạch 08–14/11 ↗</button>')}
${section('Lộ trình từ nay đến kỳ nhập học','Các tháng là khung công việc, không phải ngày hết hạn đã công bố.','<button class="btn btn-ghost" data-page="plan">Mở toàn bộ kế hoạch ↗</button>')}
${timeline()}
<div class="grid grid-2 section-pad"><div class="card">${section('Ưu tiên tháng 11/2026','Bấm từng đầu việc để cập nhật và gắn minh chứng.','<button class="btn btn-sm" data-page="plan">Xem tất cả</button>')}${actionRow(upcoming,7)}</div><div class="stack"><div class="card"><div class="progress-block"><div class="donut" style="--p:${pct(finished,total)}"><div class="center">${pct(finished,total)}%<small>HOÀN TẤT</small></div></div><div><div class="kicker">Độ sẵn sàng hồ sơ</div><h2 class="section-title" style="margin:8px 0">${finished} đầu việc đã xong</h2><div class="section-sub">Tiến độ checklist, không phải tỷ lệ trúng tuyển.</div><button class="btn btn-sm" style="margin-top:12px" data-action="export-checklist">Xuất checklist còn mở</button></div></div></div><div class="card"><div class="kicker">CẦN XÁC MINH</div><h2 class="section-title" style="margin:10px 0">${needs} trường thiếu thông tin đầu vào/chi phí/hạn</h2><p class="muted tiny">Tách rõ: chương trình dạy tiếng Anh, phiếu điểm TOEIC được chấp nhận, học phí, học bổng, hạn nộp thực tế.</p><div class="list-links"><button class="btn btn-sm" data-page="schools">Đối chiếu trường</button><button class="btn btn-sm" data-page="research">Ghi nguồn nghiên cứu</button></div></div></div></div>
${section('Các luồng quan trọng','Theo dõi độc lập, tránh bỏ sót một điều kiện riêng của từng trường.')}
<div class="grid grid-3">${[['◎','TOEIC 1/2/3','Nhập điểm L/R, ngày thi thật, nguồn và tiến độ.','english'],['▤','Trường & ngành','Tách dữ liệu chưa rõ khỏi mức độ phù hợp.','schools'],['◇','Build profile','Báo cáo mẫu, 2 sự kiện, CV, khóa nền.','profile'],['☷','Giấy tờ & thư','Học bạ, scan, study plan, 2 thư giới thiệu.','documents'],['✧','Học bổng','Theo dõi MOE và từng trường riêng biệt.','scholarships'],['₫','Ngân sách','Theo chi chuẩn bị và mục tiêu ròng 60–80 triệu/năm.','budget']].map(x=>`<div class="card"><div class="kicker">${x[0]} · WORKSTREAM</div><h3 style="margin:13px 0 7px">${x[1]}</h3><p class="muted tiny">${x[2]}</p><button class="btn btn-sm" data-page="${x[3]}">Mở khu vực →</button></div>`).join('')}</div>`;}
function filteredTasks(){return state.tasks.filter(t=>(filters.month==='Tất cả'||t.month===filters.month)&&(filters.week==='Tất cả'||t.week===filters.week)&&(filters.area==='Tất cả'||t.area===filters.area)&&(filters.status==='Tất cả'||t.status===filters.status)&&(!filters.search||`${t.title} ${t.notes} ${t.output}`.toLowerCase().includes(filters.search.toLowerCase())));}
function tasksTable(){const arr=filteredTasks();return `<div class="section-sub" style="margin:0 0 10px">Hiển thị ${arr.length}/${state.tasks.length} công việc</div><div class="table-wrap"><table class="table"><thead><tr><th>Công việc / đầu ra</th><th>Tháng</th><th>Tuần</th><th>Nhóm</th><th>Trạng thái</th><th></th></tr></thead><tbody>${arr.length?arr.map(t=>`<tr><td style="min-width:280px"><button class="taskname" data-action="edit-task" data-id="${attr(t.id)}">${esc(t.title)}</button><div class="note" style="margin-top:4px">${esc(t.output||'Chưa nhập đầu ra')}</div></td><td>${esc(t.month||'—')}</td><td>${esc(t.week||'—')}</td><td><span class="pill">${esc(t.area)}</span></td><td>${statusSelect('tasks',t)}</td><td><button class="btn btn-sm" data-action="edit-task" data-id="${attr(t.id)}">Sửa</button></td></tr>`).join(''):`<tr><td colspan="6">${empty('Không có công việc phù hợp bộ lọc.')}</td></tr>`}</tbody></table></div>`;}
function plan(){return `${head('PLANNING & EXECUTION','Kế hoạch tuần / tháng','Quản lý các đầu việc quan trọng theo mục tiêu và minh chứng. Tuần 1–4 là phân đoạn nội bộ, không phải hạn tuyển sinh.',`<div class="inline-btns"><button class="btn" data-action="export-checklist">↓ Checklist .txt</button><button class="btn btn-primary" data-action="add-task">+ Thêm nhiệm vụ</button></div>`)}
<div class="grid grid-3">${MONTH_GOALS.slice(0,3).map(g=>{let n=monthTaskCount(g.m);return `<div class="card"><div class="kicker">${g.m}</div><h3 style="margin:8px 0">${esc(g.title)}</h3><p class="muted tiny">${esc(g.desc)}</p><div class="track"><span style="width:${pct(n.complete,n.total)}%"></span></div><div class="note" style="margin-top:7px">${n.complete}/${n.total} hoàn thành</div></div>`}).join('')}</div>
${section('Bảng hành động','Lọc, đổi trạng thái trực tiếp hoặc mở từng nhiệm vụ để sửa.')}
<div class="filters"><input class="filter search" id="fSearch" placeholder="Tìm tên nhiệm vụ hoặc đầu ra..." value="${attr(filters.search)}" aria-label="Tìm nhiệm vụ"><select class="filter" id="fMonth">${opts(['Tất cả',...MONTHS],filters.month)}</select><select class="filter" id="fWeek">${opts(['Tất cả',...WEEKS],filters.week)}</select><select class="filter" id="fArea">${opts(['Tất cả',...AREAS],filters.area)}</select><select class="filter" id="fStatus">${opts(['Tất cả',...STATUS],filters.status)}</select><button class="btn btn-sm" data-action="clear-filters">Xóa lọc</button></div><div id="taskTableMount">${tasksTable()}</div>
${section('Mục tiêu theo tháng','Từng đầu ra này được kế thừa từ NAM HUB trên Notion.')}${timeline()}
<div class="callout" style="margin-top:18px">Nguyên tắc: mọi hạn nộp hoặc ca thi chưa có văn bản/biên nhận chỉ là <strong>dự kiến nội bộ</strong>. Có thể ghi hạn chính thức trong từng nhiệm vụ khi đã xác minh.</div>`;}
function english(){const exams=state.exams;return `${head('LANGUAGE READINESS','TOEIC & tiếng Anh','Tách đề chẩn đoán/thi thử khỏi điểm thi chính thức. Các lần thi 1/2/3 là mốc kế hoạch có điều kiện, chưa phải ca thi đã đăng ký.',`<div class="inline-btns"><button class="btn" data-action="edit-english-goal">Sửa mục tiêu</button><button class="btn btn-primary" data-action="add-exam">+ Thêm lần test</button></div>`)}
${banner('<strong>Điểm TOEIC đầu vào từng trường chưa được xác minh.</strong> Mốc 550+ là tham chiếu từ trao đổi trước; 650+ là mức phấn đấu đang đề xuất, không phải yêu cầu được trường xác nhận. Không tự cộng điểm khi thiếu Listening hoặc Reading.')}
<div class="grid grid-3"><div class="card metric"><div class="label">Mốc tham chiếu thảo luận</div><div class="big" style="font-size:28px">${esc(state.profile.englishBenchmark||'Chưa chốt')}</div><div class="small">Chưa mặc định đủ điều kiện từng trường</div></div><div class="card metric"><div class="label">Aim nâng cao (nội bộ)</div><div class="big" style="font-size:23px">${esc(state.profile.englishStretch||'Chưa chốt')}</div><div class="small">Có thể thay đổi khi có test và yêu cầu chính thức</div></div><div class="card metric"><div class="label">Lần test/thi đã hoàn tất</div><div class="big">${done(exams)}<span class="muted" style="font-size:18px"> / ${exams.length}</span></div><div class="small">Điểm chỉ hiển thị khi đã ghi rõ L và R</div></div></div>
${section('Các lần test và thi TOEIC','Chọn sửa để lưu điểm thực tế, ngày thi, phiếu điểm, ghi chú.')}<div class="grid grid-2">${exams.map(e=>{let hasL=String(e.listening).trim()!==''&&String(e.reading).trim()!=='';let score=hasL?Number(e.listening)+Number(e.reading):null;return `<div class="card"><div class="school-header"><div><div class="kicker">${esc(e.month||'CHƯA CHỐT THÁNG')}</div><h3 class="school-title" style="margin-top:8px">${esc(e.name)}</h3></div>${badge(e.status)}</div><div class="grid grid-3" style="gap:9px;margin:13px 0"><div class="card" style="background:#f7fafc;box-shadow:none;padding:12px"><div class="note">Listening</div><div class="measurable">${e.listening!==''?esc(e.listening):'—'}</div></div><div class="card" style="background:#f7fafc;box-shadow:none;padding:12px"><div class="note">Reading</div><div class="measurable">${e.reading!==''?esc(e.reading):'—'}</div></div><div class="card" style="background:#eef9f7;box-shadow:none;padding:12px"><div class="note">Tổng</div><div class="measurable" style="color:var(--teal)">${score!==null?score:'—'}</div></div></div><div class="statline">Ngày thực tế: ${e.date?esc(e.date):'<em>chưa xác định</em>'}</div><div class="statline">Minh chứng: ${link(e.evidence,'Mở phiếu điểm')}</div><p class="note" style="min-height:27px">${esc(e.notes||'Chưa có ghi chú')}</p><button class="btn btn-sm" data-action="edit-exam" data-id="${attr(e.id)}">Cập nhật lần test / thi</button></div>`}).join('')}</div>
${section('Quy trình đo tiến bộ','Không điền kết quả tự động; nhập điểm trên phiếu hoặc bài thi thật.')}
<div class="grid grid-3">${[['01','Chẩn đoán','Ghi Listening, Reading và 5 nhóm lỗi; phân biệt thi thử với thi chính thức.'],['02','Theo dõi mỗi 2 tuần','Làm đề mới, cập nhật L/R và lỗi; so với lần trước để điều chỉnh gia sư.'],['03','Thi đúng thời điểm','Chỉ chốt lịch 1/2/3 sau khi xét aim, thời gian trả điểm và hạn trường.']].map(x=>`<div class="card"><div class="kicker">STEP ${x[0]}</div><h3>${x[1]}</h3><p class="muted tiny">${x[2]}</p></div>`).join('')}</div>`;}
function schoolTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Trường/chương trình</th><th>Học phí/năm</th><th>Yêu cầu đầu vào</th><th>Học bổng</th><th>Hạn 2027</th><th>Phù hợp</th><th>Chứng cứ</th></tr></thead><tbody>${state.schools.map(s=>`<tr><td style="min-width:195px"><button class="taskname" data-action="edit-school" data-id="${attr(s.id)}">${esc(s.name)}</button><div class="note">${esc(s.program||'Chưa xác định')}</div></td><td>${s.tuition!==''?money(s.tuition):val('')}</td><td>${val(s.entry)}</td><td>${val(s.scholarship)}</td><td>${val(s.deadline)}</td><td>${val(s.fit)}</td><td>${link(s.source,'Nguồn chính thức')}</td></tr>`).join('')}</tbody></table></div>`;}
function schools(){return `${head('SCHOOL & PROGRAM DECISIONS','So sánh trường và chọn ngành','Chỉ so sánh khi có nguồn chính thức. Tên chương trình dưới đây là hướng nghiên cứu, chưa xác nhận có tuyển sinh đúng chương trình/kỳ 2027.',`<div class="inline-btns"><button class="btn" data-action="edit-majors">Chọn ngành ưu tiên</button><button class="btn btn-primary" data-action="add-school">+ Thêm trường</button></div>`)}
${banner('<strong>Chưa có số học phí, học bổng, yêu cầu TOEIC hay hạn nộp chính thức được đưa vào.</strong> Các ô thiếu giữ nguyên “Chưa xác định”, không suy diễn từ năm cũ hoặc thông tin trung tâm.')}
<div class="grid grid-3">${[['Economics','Tư duy phân tích, dữ liệu và chính sách kinh tế.'],['International Business','Quản trị, ngoại thương và kinh doanh quốc tế.'],['Finance','Tài chính, định lượng và phân tích doanh nghiệp.']].map(x=>`<div class="card"><div class="kicker">NGÀNH ĐANG XEM XÉT</div><h3 class="school-title" style="margin-top:11px">${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>
<div class="card" style="margin-top:14px"><div class="flex-between" style="flex-wrap:wrap"><div><strong>Ngành chính:</strong> ${esc(state.profile.primaryMajor||'Chưa quyết định')} <span class="muted"> · </span> <strong>Ngành dự phòng:</strong> ${esc(state.profile.backupMajor||'Chưa quyết định')}</div><button class="btn btn-sm" data-action="edit-majors">Cập nhật lựa chọn</button></div></div>
${section('Danh sách trường','Đã khởi tạo 4 trường từ NAM HUB (có thêm Yuan Ze); có thể thêm hoặc sửa bất cứ lúc nào.')}
<div class="grid grid-2">${state.schools.map(s=>`<div class="card school-card"><div class="school-header"><div><div class="kicker">CANDIDATE SCHOOL</div><h3 class="school-title">${esc(s.name)}</h3><p>${esc(s.program||'Chưa xác định chương trình')}</p></div>${s.verifiedAt&&s.source?'<span class="badge b-done">Có nguồn</span>':'<span class="badge b-pending">Cần đối chiếu</span>'}</div><div class="school-fields"><div><div class="label">Ngành liên quan</div><div class="value">${val(s.majors)}</div></div><div><div class="label">Mức độ phù hợp</div><div class="value">${val(s.fit)}</div></div><div><div class="label">Học phí/năm</div><div class="value">${s.tuition!==''?money(s.tuition):val('')}</div></div><div><div class="label">Hạn nộp chính thức</div><div class="value">${val(s.deadline)}</div></div></div><div class="verification">${esc(s.notes||'Chưa có ghi chú xác minh.')}</div><div class="flex-between" style="margin-top:15px"><span class="tiny muted">${s.verifiedAt?'Kiểm tra: '+esc(s.verifiedAt):'Chưa ghi ngày kiểm tra'}</span><button class="btn btn-sm" data-action="edit-school" data-id="${attr(s.id)}">Sửa dữ liệu</button></div></div>`).join('')}</div>
${section('Bảng so sánh điều kiện','Số học phí chỉ nhập khi có giá trị có thể đối chiếu; ghi đơn vị VND/năm trong mẫu chỉnh sửa.')}${schoolTable()}`;}
function genericCards(collection){const items=state[collection]||[];return `<div class="grid grid-2">${items.map(x=>`<div class="card"><div class="school-header"><div><h3 style="margin:0 0 5px;font-size:14px">${esc(x.title)}</h3>${x.type?`<div class="note">${esc(x.type)} · ${esc(x.month||'Chưa chốt')}</div>`:''}${x.school?`<div class="note">${esc(x.school)}</div>`:''}</div>${badge(x.status)}</div>${x.notes?`<p class="muted tiny">${esc(x.notes)}</p>`:''}${collection==='scholarships'?`<div class="school-fields"><div><div class="label">Điều kiện</div><div class="value">${val(x.requirements)}</div></div><div><div class="label">Giá trị</div><div class="value">${val(x.amount)}</div></div><div><div class="label">Deadline</div><div class="value">${val(x.deadline)}</div></div><div><div class="label">Nguồn</div><div class="value">${link(x.source)}</div></div></div>`:`<div class="statline">Minh chứng: ${link(x.source)}</div>`}<div class="flex-between" style="margin-top:12px">${statusSelect(collection,x)}<button class="btn btn-sm" data-action="edit-${collection}" data-id="${attr(x.id)}">Sửa / ghi chú</button></div></div>`).join('')}</div>`;}
function documents(){return `${head('DOCUMENT CONTROL','Giấy tờ & thư giới thiệu','Theo dõi tình trạng thu thập, dịch, chứng thực, ký và nộp. Không tải bản scan hộ chiếu hay thông tin nhạy cảm vào bộ nhớ trình duyệt.',`<button class="btn btn-primary" data-action="add-docs">+ Thêm tài liệu</button>`)}
${banner('<strong>Cần kiểm tra checklist riêng từng trường và MOE.</strong> Không phải mọi giấy tờ dưới đây đều chắc chắn bắt buộc ở tất cả chương trình. Gắn URL tài liệu vào Drive/Notion của bạn thay vì nhúng dữ liệu cá nhân trong Site.')}
<div class="card"><div class="flex-between"><div><h3 style="margin:0">Tiến độ giấy tờ</h3><div class="note">${done(state.docs)}/${state.docs.length} mục hoàn tất</div></div><div style="font-size:25px;font-weight:850;color:var(--teal)">${pct(done(state.docs),state.docs.length)}%</div></div><div class="track" style="margin-top:13px"><span style="width:${pct(done(state.docs),state.docs.length)}%"></span></div></div>

const ACT_FIELDS=[field('title','Tên hoạt động / sản phẩm','text',null,true,true),field('type','Loại','select',['Báo cáo','Sự kiện','Khóa học','Portfolio','Khác']),field('month','Tháng mục tiêu','select',MONTHS),COMMON_STATUS,field('source','Link minh chứng','url',null,false,true),field('notes','Đầu ra và ghi chú','textarea',null,false,true)];
const SCH_FIELDS=[field('title','Tên học bổng','text',null,true,true),field('school','Trường / đơn vị','text'),COMMON_STATUS,field('amount','Mức hỗ trợ / đơn vị (chưa có thì để trống)','text',null,false,true),field('requirements','Điều kiện / duy trì','textarea',null,false,true),field('deadline','Hạn nộp năm 2027','text'),field('source','Link nguồn xác minh','url',null,false,true),field('notes','Ghi chú','textarea',null,false,true)];
const EXP_FIELDS=[field('title','Tên khoản chi','text',null,true,true),field('month','Tháng','select',MONTHS.slice(0,5)),field('category','Loại chi','select',['Gia sư / tiếng Anh','Phí thi TOEIC','Hồ sơ / dịch thuật','Sự kiện / khóa học','Khác']),field('amount','Chi thực tế (VND)','number',null,true),field('notes','Ghi chú','textarea',null,false,true)];
const RESEARCH_FIELDS=[field('title','Chủ đề nghiên cứu','text',null,true,true),field('subject','Trường / đối tượng','text'),field('date','Ngày xác minh','date'),COMMON_STATUS,field('finding','Thông tin phát hiện / điều cần đối chiếu','textarea',null,false,true),field('source','Link nguồn (ưu tiên tài liệu chính thức)','url',null,false,true)];
function drawModal(title,fields,record,handle,deleteFn){const inner=fields.map(f=>{let current=record[f.name]??'';let input=f.type==='textarea'?`<textarea class="field" name="${f.name}" ${f.required?'required':''} rows="3">${esc(current)}</textarea>`:f.type==='select'?`<select class="field" name="${f.name}">${opts(f.options||[],current)}</select>`:`<input class="field" name="${f.name}" type="${f.type}" value="${attr(current)}" ${f.type==='number'?'min="0" step="1"':''} ${f.required?'required':''}>`;return `<div class="form-group ${f.span?'full':''}"><label for="field-${f.name}">${esc(f.label)}</label>${input}${f.hint?`<div class="note">${esc(f.hint)}</div>`:''}</div>`;}).join('');$('#modalRoot').innerHTML=`<div class="modal-overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${attr(title)}"><div class="modal-header"><h2>${esc(title)}</h2><button class="close" id="modalClose" aria-label="Đóng">×</button></div><form id="editForm"><div class="modal-body"><div class="modal-grid">${inner}</div></div><div class="modal-footer"><div>${deleteFn?'<button type="button" class="btn btn-danger" id="modalDelete">Xóa bản ghi</button>':'<span class="note">Những trường chưa biết có thể để trống.</span>'}</div><div class="inline-btns"><button type="button" class="btn" id="modalCancel">Hủy</button><button class="btn btn-primary" type="submit">Lưu thay đổi</button></div></div></form></section></div>`;const close=()=>$('#modalRoot').innerHTML='';$('#modalClose').onclick=close;$('#modalCancel').onclick=close;$('#overlay').onclick=e=>{if(e.target.id==='overlay')close();};$('#editForm').onsubmit=e=>{e.preventDefault();const formData=new FormData(e.target);const obj={...record};fields.forEach(f=>{let v=formData.get(f.name);if(f.type==='number'&&v!==null&&v!=='')v=Number(v);obj[f.name]=v??'';});if(fields===EXAM_FIELDS&&obj.listening!==''&&obj.reading!==''&&(Number(obj.listening)+Number(obj.reading)>990||Number(obj.listening)>495||Number(obj.reading)>495)){toast('Kiểm tra lại điểm TOEIC: L và R tối đa 495, tổng tối đa 990.');return;}if(fields===SCHOOL_FIELDS&&obj.tuition!==''&&Number(obj.tuition)<0){toast('Học phí không thể âm');return;}handle(obj);close();render(true);toast('Đã lưu thay đổi trên trình duyệt này.');};if(deleteFn){$('#modalDelete').onclick=()=>{if(confirm('Xóa bản ghi này? Hãy xuất sao lưu nếu cần giữ.')){deleteFn();close();render(true);toast('Đã xóa.');}}}}
function editCollection(key,id,add=false){const config={tasks:{label:'nhiệm vụ',fields:TASK_FIELDS,id:'t'},schools:{label:'trường',fields:SCHOOL_FIELDS,id:'s'},exams:{label:'bài test/thi',fields:EXAM_FIELDS,id:'e'},docs:{label:'tài liệu',fields:DOC_FIELDS,id:'d'},activities:{label:'hoạt động',fields:ACT_FIELDS,id:'a'},scholarships:{label:'học bổng',fields:SCH_FIELDS,id:'h'},expenses:{label:'khoản chi',fields:EXP_FIELDS,id:'c'},research:{label:'mục nghiên cứu',fields:RESEARCH_FIELDS,id:'r'}}[key];if(!config)return;
let old=state[key].find(x=>x.id===id);if(!old&&!add)return;const def={id:uid(config.id),status:key==='scholarships'||key==='research'?'Chờ xác minh':'Chưa làm',month:filters.month==='Tất cả'?'11/2026':filters.month,week:'Cả tháng',area:'Hồ sơ',category:'Khác',type:'Khác',fit:'Chưa đánh giá'};const src=add?def:old;
drawModal((add?'Thêm ':'Cập nhật ')+config.label,config.fields,src,(changed)=>{if(add){state[key].push(changed);}else{state[key]=state[key].map(x=>x.id===id?changed:x);}logChange(`${add?'Thêm':'Cập nhật'} ${config.label}: ${changed.title||changed.name}`);},add?null:()=>{state[key]=state[key].filter(x=>x.id!==id);logChange(`Xóa ${config.label}: ${old.title||old.name}`);});}
function editSimple(title,fields,which){drawModal(title,fields,state[which],next=>{state[which]={...state[which],...next};logChange('Cập nhật: '+title);});}
function handleAction(action,id){switch(action){case'add-task':return editCollection('tasks',null,true);case'edit-task':return editCollection('tasks',id);case'add-school':return editCollection('schools',null,true);case'edit-school':return editCollection('schools',id);case'add-exam':return editCollection('exams',null,true);case'edit-exam':return editCollection('exams',id);case'add-docs':return editCollection('docs',null,true);case'edit-docs':return editCollection('docs',id);case'add-activities':return editCollection('activities',null,true);case'edit-activities':return editCollection('activities',id);case'add-scholarships':return editCollection('scholarships',null,true);case'edit-scholarships':return editCollection('scholarships',id);case'add-expense':return editCollection('expenses',null,true);case'edit-expense':return editCollection('expenses',id);case'add-research':return editCollection('research',null,true);case'edit-research':return editCollection('research',id);
case'edit-majors':return editSimple('Chọn ngành chính / dự phòng',[field('primaryMajor','Ngành chính','select',['Chưa quyết định','Economics','International Business','Finance']),field('backupMajor','Ngành dự phòng','select',['Chưa quyết định','Economics','International Business','Finance'])],'profile');
case'edit-english-goal':return editSimple('Mục tiêu TOEIC (mốc nội bộ)',[field('englishBenchmark','Mốc tham chiếu','text',null,false,true),field('englishStretch','Aim nâng cao đang đề xuất','text',null,false,true)],'profile');
case'edit-budget-goals':return editSimple('Mục tiêu ngân sách',[field('prepMin','Mức chuẩn bị tối thiểu / tháng (VND)','number'),field('prepMax','Mức chuẩn bị tối đa / tháng (VND)','number'),field('goalNetMin','Mục tiêu ròng/năm tối thiểu (VND)','number'),field('goalNetMax','Mục tiêu ròng/năm tối đa (VND)','number')],'profile');
case'edit-scenario':return editSimple('Kịch bản tài chính một năm',[field('tuition','Học phí thực tế quy đổi (VND/năm)','number'),field('scholarship','Học bổng áp dụng được (VND/năm)','number'),field('living','Sinh hoạt phí dự kiến (VND/năm)','number'),field('other','Phí khác (VND/năm)','number')],'scenarios');
case'export-json':return downloadFile('nam-taiwan-2027-backup.json',JSON.stringify(state,null,2),'application/json');
case'export-checklist':return exportChecklist();case'export-priority':{const ids=['t6','t5','t1','t2','t3','t8','t7','t9'];const txt=['NAM HUB — ƯU TIÊN 08–14/11/2026','CN 08/11 · 13:00–18:00 là block có sẵn; không tạo sự kiện.','CN 15/11 · 13:00–18:00 để rà kết quả.','P1 Xác minh trung tâm/điều kiện trường → P2 chốt hướng → P3 TOEIC; P4 giấy tờ song song; P5 liên hệ giáo viên.','',...ids.map((id,i)=>{const t=state.tasks.find(x=>x.id===id);return t?`${i+1}. [${t.status}] ${t.title}\n   Đầu ra: ${t.output}\n   Notion: ${t.source}`:''})].join('\n');return downloadFile('nam-taiwan-priority-08-14-11-2026.txt',txt,'text/plain');}
case'export-csv':return exportCsv();
case'import-json':return $('#fileImport')?.click();
case'clear-filters':filters={month:'Tất cả',week:'Tất cả',area:'Tất cả',status:'Tất cả',search:''};return render(true);
}}
function downloadFile(filename,content,mime){const blob=new Blob([content],{type:mime+';charset=utf-8'});const object=URL.createObjectURL(blob);const a=document.createElement('a');a.href=object;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(object),2000);}
function exportChecklist(){const rows=state.tasks.filter(t=>t.status!=='Hoàn tất');const lines=['NAM HUB — CHECKLIST TAIWAN 2027','Ngày xuất: '+new Date().toLocaleDateString('vi-VN'),'Mốc nộp mục tiêu 03/2027 chỉ là kế hoạch, chưa phải hạn chính thức.','Trạng thái: chưa làm / đang làm / chờ xác minh / hoàn tất.',''];MONTHS.forEach(m=>{const list=rows.filter(t=>t.month===m);if(!list.length)return;lines.push('=== '+m+' ===');list.forEach(t=>{lines.push(`[ ] [${t.status}] ${t.title}`);lines.push('  Nhóm: '+t.area+' | '+t.week);if(t.output)lines.push('  Đầu ra: '+t.output);if(t.due)lines.push('  Ngày hạn: '+t.due+' ('+(t.deadlineType||'chưa rõ loại hạn')+')');if(t.source)lines.push('  Nguồn: '+t.source);if(t.notes)lines.push('  Ghi chú: '+t.notes);lines.push('');});});lines.push('CẦN XÁC MINH RIÊNG TỪNG TRƯỜNG');state.schools.forEach(s=>lines.push('- '+s.name+': deadline '+(s.deadline||'CHƯA XÁC ĐỊNH')+'; điều kiện '+(s.entry||'CHƯA XÁC ĐỊNH')+'; học bổng '+(s.scholarship||'CHƯA XÁC ĐỊNH')));downloadFile('nam-taiwan-2027-checklist.txt',lines.join('\n'),'text/plain');toast('Đã xuất checklist những việc chưa hoàn tất.');}
function exportCsv(){const cols=['title','month','week','area','status','output','due','deadlineType','notes','source'];const arr=[cols.map(x=>`"${x}"`).join(','),...state.tasks.map(t=>cols.map(k=>'"'+String(t[k]??'').replaceAll('"','""')+'"').join(','))];downloadFile('nam-taiwan-2027-tasks.csv','\ufeff'+arr.join('\n'),'text/csv');toast('Đã xuất CSV công việc.');}
function importJson(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.schools)||!Array.isArray(data.exams)||!Array.isArray(data.docs)||!Array.isArray(data.expenses)){throw new Error('Thiếu bảng bắt buộc');}if(confirm('Nhập bản sao lưu sẽ thay thế dữ liệu đang lưu trên trình duyệt này. Bạn có muốn tiếp tục?')){state={...JSON.parse(JSON.stringify(INITIAL)),...data};logChange('Khôi phục từ tệp JSON');render();toast('Đã nhập bản sao lưu.');}}catch(err){toast('Tệp JSON không hợp lệ: '+err.message);}};reader.readAsText(file);}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;if(nav.dataset.month){filters.month=nav.dataset.month;filters.week='Tất cả';filters.area='Tất cả';filters.status='Tất cả';filters.search='';}$('#sidebar').classList.remove('open');render();return;}const btn=e.target.closest('[data-action]');if(btn)handleAction(btn.dataset.action,btn.dataset.id);});
document.addEventListener('change',e=>{const tgt=e.target;if(tgt.matches('[data-status-collection]')){let key=tgt.dataset.statusCollection;let obj=state[key]?.find(x=>x.id===tgt.dataset.id);if(!obj)return;obj.status=tgt.value;logChange(`Đổi trạng thái: ${obj.title||obj.name} → ${obj.status}`);render(true);return;}const id=tgt.id;if(['fMonth','fWeek','fArea','fStatus'].includes(id)){filters[{fMonth:'month',fWeek:'week',fArea:'area',fStatus:'status'}[id]]=tgt.value;$('#taskTableMount').innerHTML=tasksTable();return;}if(id==='fileImport'){importJson(tgt.files[0]);tgt.value='';}});
document.addEventListener('input',e=>{if(e.target.id==='fSearch'){filters.search=e.target.value;$('#taskTableMount').innerHTML=tasksTable();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML){$('#modalRoot').innerHTML='';}});
$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');
render();
})();
</script></body></html>
